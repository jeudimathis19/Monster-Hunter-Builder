# Keeps the game data up to date without anyone running a command:
# every Monday (and on demand from the Actions tab) the database is rebuilt from
# the MHDB Wilds API and the community wiki, the site's data files are exported,
# and the result is committed only when something changed. GitHub Pages then
# republishes the site.
name: Update game data

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Rebuild game data
        run: |
          npm run seed
          npm run gathering
          npm run seed
          npm run export
          npm run featured

      - name: Commit changes
        run: |
          # Only the site's data files matter: gathering.json carries a run date.
          if git diff --quiet -- data; then
            echo "Game data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add monster_hunter.db data scripts/gathering.json
          git commit -m "Update game data"
          git push
